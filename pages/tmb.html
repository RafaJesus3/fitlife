<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMB</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins"
      rel="stylesheet"
    />
  </head>

  <body style="font-family: Poppins">
    <nav>
      <a href="../index.html">
        <p>FitLife</p>
      </a>

      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="imc.html">IMC</a></li>
        <li><a href="tmb.html">TMB</a></li>
        <li><a href="water.html">Água</a></li>
        <li><a href="profile.html">Perfil</a></li>
      </ul>
    </nav>

    <main>
      <section>
        <header>
          <h1>Cálculo de TMB</h1>
          <img src="../assets/images/tmb.png" alt="Ícone de TMB" width="100" />
        </header>

        <form action="#" method="GET">
          <div>
            <label for="sex">Sexo</label>
            <select id="sex" name="sex" required>
              <option value="male">Masculino</option>
              <option value="female">Feminino</option>
            </select>
          </div>

          <div>
            <label for="weight">Peso (kg)</label>
            <input
              name="weight"
              id="weight"
              type="number"
              placeholder="Ex: 70"
              step="0.1"
              required
            />
          </div>

          <div>
            <label for="height">Altura (cm)</label>
            <input
              name="height"
              id="height"
              type="number"
              placeholder="Ex: 175"
              step="0.01"
              required
            />
          </div>

          <div>
            <label for="age">Idade</label>
            <input
              name="age"
              id="age"
              type="number"
              placeholder="Ex: 25"
              required
            />
          </div>

          <button type="submit">Calcular calorias</button>
        </form>

        <div>
          <p>Gasto Calórico basal:</p>
          <p>00.0</p>
          <p>Kcal/dia</p>
        </div>

        <a href="../index.html">Voltar</a>
      </section>
    </main>

    <footer>
      <p>© 2026 FitLife</p>
    </footer>
  </body>
</html>
