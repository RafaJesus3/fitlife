<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMC</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css"/>
  </head>

  <body>
    <nav>
      <a href="../index.html">
        <p>FitLife</p>
      </a>

      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="imc.html">IMC</a></li>
        <li><a href="tmb.html">TMB</a></li>
        <li><a href="water.html">Água</a></li>
        <li><a href="profile.html">Perfil</a></li>
      </ul>
    </nav>

    <main>
      <section>
        <header>
          <h1>Cálculo de IMC</h1>
          <img src="../assets/images/imc.png" alt="Ícone de IMC" width="100" />
        </header>

        <form action="#" method="GET">
          <div>
            <label for="weight">Peso (kg)</label>
            <input
              id="weight"
              name="weight"
              type="number"
              placeholder="Ex: 70"
              step="0.1"
              required
            />
          </div>

          <div>
            <label for="height">Altura (m)</label>
            <input
              id="height"
              name="height"
              type="number"
              placeholder="Ex: 1.75"
              step="0.01"
              required
            />
          </div>

          <button type="submit">Calcular</button>
        </form>

        <div>
          <p>Seu IMC é:</p>
          <h2>00.0</h2>
          <p>Classificação</p>
        </div>

        <a href="../index.html">Voltar</a>
      </section>
    </main>
  </body>
</html>
