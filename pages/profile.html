    <link
      href="https://fonts.googleapis.com/css2?family=Poppins"
      rel="stylesheet"

    <link rel="stylesheet" href="../css/styles.css" />

  <body>
    <nav>
      <a href="../index.html">
        <p>FitLife</p>
      </a>

      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="imc.html">IMC</a></li>
        <li><a href="tmb.html">TMB</a></li>
        <li><a href="water.html">Água</a></li>
      </ul>
    </nav>

    <main>
      <section>
        <h1>Perfil</h1>

        <form>
          <div>
            <label for="name">Nome:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Ex: João da Silva"
            />
          </div>

          <div>
            <label for="age">Idade:</label>
            <input type="number" id="age" name="age" placeholder="Ex: 25" />
          </div>

          <div>
            <label for="objective">Objetivo:</label>
            <select id="objective" name="objective">
              <option value="perder_peso">Perder peso</option>
              <option value="manter_peso">Manter peso</option>
              <option value="ganhar_musculo">Ganhar músculo</option>
            </select>
          </div>

          <button type="submit">Salvar</button>
        </form>

        <div>
          <p>Status: <span>Perfil não salvo</span></p>
        </div>

        <a href="../index.html">Voltar</a>
      </section>
    </main>
  </body>
</html>
